name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a running release-session check. GitHub serializes this group,
  # so concurrent push and manual runs remain resource-bounded.
  cancel-in-progress: false

jobs:
  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install minimum Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: 1.88.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-1.88-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check default features at MSRV
        run: cargo check --workspace --locked

      - name: Check all features at MSRV
        run: cargo check --workspace --locked --all-features

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Setup Node (for CDP smoke test)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install smoke test deps
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: smoke
        run: npm ci

      - name: CDP smoke test (Puppeteer)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_UNSAFE_ALLOW_PRIVATE_NETWORK: '1'
        run: |
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          cargo build --release
          ./target/release/plasmate serve --protocol cdp --host 127.0.0.1 --port 9222 2>/dev/null &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "CDP server exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:9222/json/version >/dev/null
          timeout 60s node smoke/puppeteer-smoke.mjs

      - name: MCP smoke test
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_BIN: ./target/release/plasmate
          MCP_SMOKE_RPC_TIMEOUT: '20'
          MCP_SMOKE_OVERALL_TIMEOUT: '120'
          PLASMATE_UNSAFE_ALLOW_PRIVATE_NETWORK: '1'
        run: python3 smoke/mcp-smoke.py

      - name: MCP smoke harness failure tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: python3 -m unittest smoke/test_mcp_smoke_harness.py

      - name: Deterministic agent task benchmark
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          mkdir -p artifacts
          ./target/release/plasmate agent-task-benchmark-v1 \
            --output artifacts/agent-task-benchmark-v1.json
          ./target/release/plasmate agent-task-benchmark-validate \
            --input artifacts/agent-task-benchmark-v1.json

      - name: Upload agent task benchmark evidence
        if: ${{ matrix.os == 'ubuntu-latest' && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-task-benchmark-${{ github.run_id }}
          path: artifacts/agent-task-benchmark-v1.json
          if-no-files-found: warn
          retention-days: 14

      - name: ES module smoke test
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_BIN: ./target/release/plasmate
        run: python3 smoke/module-smoke.py

      - name: Throughput benchmark
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          PLASMATE_UNSAFE_ALLOW_PRIVATE_NETWORK: '1'
        run: |
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          python3 bench/local_server.py 8765 &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "benchmark fixture server exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null
          timeout 5m ./target/release/plasmate throughput-bench 2>&1 | tee bench-results.txt

          # Extract sequential ms/page and fail if regression > 2x baseline
          MS_PER_PAGE=$(grep "Sequential:" bench-results.txt | grep -oP '[\d.]+ms/page' | grep -oP '[\d.]+')
          echo "Sequential throughput: ${MS_PER_PAGE}ms/page"
          # Baseline: 0.5ms/page on cached local pages. Fail if > 5ms (10x margin for CI variability)
          python3 -c "
          ms = float('${MS_PER_PAGE}')
          limit = 5.0
          print(f'  Result: {ms}ms/page (limit: {limit}ms)')
          if ms > limit:
              print(f'  REGRESSION: {ms}ms exceeds {limit}ms limit')
              exit(1)
          print('  PASS')
          "

  action-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: V8 compatibility contract
        run: python3 scripts/check-v8-compatibility.py

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache-dependency-path: sdk/go/go.mod

      - name: Install Python manifest dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            pytest pydantic langchain-core \
            -e packages/som-parser-python \
            -e sdk/python \
            -e integrations/browser-use \
            -e integrations/langchain

      - name: Install Node manifest dependencies
        run: |
          npm ci --prefix packages/som-parser-node
          npm ci --prefix sdk/node
          npm ci --prefix integrations/vercel-ai

      - name: Action manifest conformance
        run: ./scripts/action-manifest-conformance.sh --quick
